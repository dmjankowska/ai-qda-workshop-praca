    const left = Math.min(event.clientX - box.left + 12, box.width - 350);
    const top = Math.max(4, event.clientY - box.top + 12);
    tooltip.style.left = `${Math.max(4, left)}px`;
    tooltip.style.top = `${top}px`;
  }

  function hideTooltip() { tooltip.style.display = 'none'; }

  function setDetailNode(d) {
    const degree = visibleEdges.filter(e =&gt; e.source.id === d.id || e.target.id === d.id).length;
    detail.innerHTML = `&lt;code&gt;${d.id}&lt;/code&gt;&lt;strong&gt;${d.label}&lt;/strong&gt; &lt;span class=&quot;text-muted&quot;&gt;${d.level} · ${degree} widocznych połączeń&lt;/span&gt;`;
  }

  function setDetailEdge(d) {
    const source = typeof d.source === 'object' ? d.source : nodeById.get(d.source);
    const target = typeof d.target === 'object' ? d.target : nodeById.get(d.target);
    detail.innerHTML = `&lt;strong&gt;${source.label}&lt;/strong&gt; &lt;code&gt;${d.label}&lt;/code&gt; &lt;strong&gt;${target.label}&lt;/strong&gt; &lt;span class=&quot;text-muted&quot;&gt;${d.level} · ${d.family} · ${d.status}${d.support ? ` · n=${d.support}` : ''}&lt;/span&gt;`;
  }

  function applySelection() {
    if (!selectedId) {
      nodeLayer.selectAll('.rc-node').classed('is-selected', false).classed('rc-dim', false);
      edgeLayer.selectAll('.rc-edge').classed('rc-dim', false);
      labelLayer.selectAll('.rc-label').classed('rc-dim', false);
      return;
    }
    const neighbors = new Set([selectedId]);
    visibleEdges.forEach(edge =&gt; {
      const source = edge.source.id || edge.source;
      const target = edge.target.id || edge.target;
      if (source === selectedId) neighbors.add(target);
      if (target === selectedId) neighbors.add(source);
    });
    nodeLayer.selectAll('.rc-node')
      .classed('is-selected', d =&gt; d.id === selectedId)
      .classed('rc-dim', d =&gt; !neighbors.has(d.id));
    edgeLayer.selectAll('.rc-edge').classed('rc-dim', d =&gt; {
      const source = d.source.id || d.source;
      const target = d.target.id || d.target;
      return source !== selectedId &amp;&amp; target !== selectedId;
    });
    labelLayer.selectAll('.rc-label').classed('rc-dim', d =&gt; !neighbors.has(d.id));
  }

  function render() {
    if (simulation) simulation.stop();
    const data = currentData();
    visibleNodes = data.nodes.map(d =&gt; ({ ...d }));
    visibleEdges = data.edges.map(d =&gt; ({ ...d }));
    selectedId = visibleNodes.some(d =&gt; d.id === selectedId) ? selectedId : null;
    counts.textContent = `${visibleNodes.length} węzłów · ${visibleEdges.length} krawędzi`;

    const edges = edgeLayer.selectAll('.rc-edge').data(visibleEdges, d =&gt; d.id).join('line')
      .attr('class', 'rc-edge')
      .attr('data-kind', d =&gt; d.kind)
      .attr('data-level', d =&gt; d.level)
      .attr('stroke-width', d =&gt; edgeWidth[d.level] || 1)
      .on('pointerenter', (event, d) =&gt; {
        const source = typeof d.source === 'object' ? d.source : nodeById.get(d.source);
        const target = typeof d.target === 'object' ? d.target : nodeById.get(d.target);
        showTooltip(event, `&lt;strong&gt;${source.id} → ${target.id}&lt;/strong&gt;&lt;br&gt;${d.label}&lt;br&gt;&lt;span&gt;${d.level} · ${d.family} · ${d.status}&lt;/span&gt;`);
      })
      .on('pointermove', (event, d) =&gt; {
        const source = typeof d.source === 'object' ? d.source : nodeById.get(d.source);
        const target = typeof d.target === 'object' ? d.target : nodeById.get(d.target);
        showTooltip(event, `&lt;strong&gt;${source.id} → ${target.id}&lt;/strong&gt;&lt;br&gt;${d.label}&lt;br&gt;&lt;span&gt;${d.level} · ${d.family} · ${d.status}&lt;/span&gt;`);
      })
      .on('pointerleave', hideTooltip)
      .on('click', (event, d) =&gt; { event.stopPropagation(); setDetailEdge(d); });

    const nodes = nodeLayer.selectAll('.rc-node').data(visibleNodes, d =&gt; d.id).join('circle')
      .attr('class', 'rc-node')
      .attr('data-level', d =&gt; d.level)
      .attr('r', nodeRadius)
      .on('pointerenter', (event, d) =&gt; showTooltip(event, `&lt;strong&gt;${d.id}&lt;/strong&gt;&lt;br&gt;${d.label}&lt;br&gt;&lt;span&gt;${d.level}&lt;/span&gt;`))
      .on('pointermove', (event, d) =&gt; showTooltip(event, `&lt;strong&gt;${d.id}&lt;/strong&gt;&lt;br&gt;${d.label}&lt;br&gt;&lt;span&gt;${d.level}&lt;/span&gt;`))
      .on('pointerleave', hideTooltip)
      .on('click', (event, d) =&gt; {
        event.stopPropagation();
        selectedId = selectedId === d.id ? null : d.id;
        if (selectedId) setDetailNode(d);
        else detail.innerHTML = '&lt;span class=&quot;text-muted&quot;&gt;Wybierz węzeł lub relację, aby zobaczyć szczegóły.&lt;/span&gt;';
        applySelection();
      });

    nodes.call(d3.drag()
      .on('start', (event, d) =&gt; { if (!event.active) simulation.alphaTarget(.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) =&gt; { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) =&gt; { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

    const labels = labelLayer.selectAll('.rc-label').data(
      visibleNodes.filter(d =&gt; d.level === 'theoretical' || d.id === selectedId), d =&gt; d.id
    ).join('text')
      .attr('class', 'rc-label')
      .attr('dx', d =&gt; nodeRadius(d) + 4)
      .attr('dy', 4)
      .text(d =&gt; `${d.id} ${d.label}`);

    simulation = d3.forceSimulation(visibleNodes)
      .force('link', d3.forceLink(visibleEdges).id(d =&gt; d.id).distance(edgeDistance).strength(d =&gt; d.kind === 'hierarchy' ? .6 : .35))
      .force('charge', d3.forceManyBody().strength(d =&gt; d.level === 'theoretical' ? -520 : d.level === 'focused' ? -115 : -38))
      .force('collide', d3.forceCollide().radius(d =&gt; nodeRadius(d) + 3))
      .force('x', d3.forceX(width / 2).strength(.035))
      .force('y', d3.forceY(height / 2).strength(.035))
      .on('tick', () =&gt; {
        edges
          .attr('x1', d =&gt; d.source.x).attr('y1', d =&gt; d.source.y)
          .attr('x2', d =&gt; d.target.x).attr('y2', d =&gt; d.target.y);
        nodes.attr('cx', d =&gt; d.x).attr('cy', d =&gt; d.y);
        labels.attr('x', d =&gt; d.x).attr('y', d =&gt; d.y);
      });
    applySelection();
    resetZoom(false);
  }

  function resetZoom(reheat = true) {
    svg.transition().duration(250).call(zoom.transform, d3.zoomIdentity);
    if (simulation &amp;&amp; reheat) simulation.alpha(.45).restart();
  }

  function selectSearchMatch() {
    const query = searchInput.value.trim().toLocaleLowerCase('pl');
    if (!query) { selectedId = null; applySelection(); return; }
    const match = visibleNodes.find(d =&gt; d.id.toLocaleLowerCase('pl') === query)
      || visibleNodes.find(d =&gt; d.label.toLocaleLowerCase('pl').includes(query));
    if (!match) return;
    selectedId = match.id;
    setDetailNode(match);
    applySelection();
    const scale = 1.8;
    svg.transition().duration(350).call(
      zoom.transform,
      d3.zoomIdentity.translate(width / 2 - match.x * scale, height / 2 - match.y * scale).scale(scale)
    );
  }

  viewSelect.addEventListener('change', render);
  familySelect.addEventListener('change', render);
  hierarchyToggle.addEventListener('change', render);
  searchInput.addEventListener('change', selectSearchMatch);
  searchInput.addEventListener('keydown', event =&gt; { if (event.key === 'Enter') { event.preventDefault(); selectSearchMatch(); } });
  resetButton.addEventListener('click', () =&gt; resetZoom(true));
  svg.on('click', () =&gt; { selectedId = null; applySelection(); });

  const resize = () =&gt; {
    const box = stage.getBoundingClientRect();
    width = Math.max(320, box.width);
    height = width &lt;= 520 ? 520 : 640;
    svg.attr('viewBox', `0 0 ${width} ${height}`).attr('height', height);
    if (simulation) {
      simulation.force('x', d3.forceX(width / 2).strength(.035));
      simulation.force('y', d3.forceY(height / 2).strength(.035));
      simulation.alpha(.25).restart();
    }
  };
  new ResizeObserver(resize).observe(stage);
  resize();
  render();
})();
&lt;/script&gt;


&lt;style id=&quot;codex-visualization-document-scrollbar&quot;&gt;html,body{scrollbar-width:none!important}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important}&lt;/style&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
